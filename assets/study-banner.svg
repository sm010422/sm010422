<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <radialGradient id="glow" cx="82%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#a371f7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#30363d"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="260" fill="#0d1117"/>
    <rect width="1200" height="260" fill="url(#dots)" opacity="0.6"/>
    <rect width="1200" height="260" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="18" fill="none" stroke="#30363d"/>

  <!-- prompt line -->
  <text x="64" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b949e">
    <tspan fill="#7ee787">sm010422</tspan><tspan>:~/study$ </tspan><tspan fill="#e6edf3">cat log.md</tspan><tspan fill="#58a6ff">▌<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan>
  </text>

  <!-- title -->
  <text x="62" y="172" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#e6edf3" letter-spacing="-1">Study Log</text>

  <!-- right side: faux log lines -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#484f58">
    <text x="860" y="52">[INFO] notes.indexed ......... ok</text>
    <text x="860" y="74">[INFO] troubleshooting ....... ok</text>
  </g>

  <!-- CTA -->
  <rect x="860" y="102" width="276" height="56" rx="28" fill="url(#accent)" opacity="0.14"/>
  <rect x="860.75" y="102.75" width="274.5" height="54.5" rx="27.25" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
  <text x="998" y="137" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e6edf3">Read on Notion  →</text>
</svg>
